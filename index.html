<style>
:root{--bg:#f4f6fa;--panel:#fff;--text:#202938;--muted:#687386;--line:#e2e7ef;--nav:#182435;--nav2:#24354b;--accent:#315ee8;--accent2:#eaf0ff;--red:#c62828;--redbg:#fff0f0;--green:#16804a;--greenbg:#e8f7ee;--amber:#9a6700;--amberbg:#fff7df;--radius:12px;--shadow:0 4px 18px #172b4d0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 12px;border-radius:8px}button:hover{border-color:#9aabd0;background:#f8faff}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--red);border-color:#f0bcbc}button.small{padding:5px 8px;font-size:12px}.app{display:flex;min-height:100vh}.sidebar{width:224px;background:var(--nav);color:#eaf0f8;padding:20px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:18px}.brand{font-weight:750;font-size:16px;padding:2px 10px 12px;line-height:1.45}.brand small{display:block;color:#aab8ca;font-size:11px;font-weight:400;margin-top:5px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#c8d3e1;text-align:left;border:0;padding:11px 12px;border-radius:9px}.nav button.active,.nav button:hover{background:var(--nav2);color:#fff}.sidefoot{margin-top:auto;color:#9eacc0;font-size:11px;padding:8px}.main{flex:1;min-width:0;padding:26px clamp(14px,2.5vw,34px) 40px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}.eyebrow{color:var(--muted);font-size:12px}.page-title{font-size:25px;font-weight:750;margin:2px 0}.sub{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.date-input,input,select,textarea{border:1px solid #d7deea;border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #b8c8ff;border-color:var(--accent)}input[type=checkbox]{accent-color:var(--accent)}.content{display:grid;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel h2,.panel h3{margin:0;font-size:16px}.muted{color:var(--muted)}.smalltext{font-size:12px;color:var(--muted)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.spread{justify-content:space-between}.row>*{max-width:100%}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}.stat:hover{border-color:#9fb3ff;transform:translateY(-1px)}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:25px;font-weight:750;margin:6px 0}.stat .desc{font-size:12px;color:var(--muted)}.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick{padding:16px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer}.quick:hover{border-color:#9fb3ff}.quick strong{display:block;margin-bottom:5px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;max-width:100%}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:middle}th{background:#f7f9fc;color:#526075;font-weight:650;position:sticky;top:0;z-index:1}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfe}td input:not([type=checkbox]),td select{width:100%;min-width:90px;padding:6px 7px;font-size:13px}td input[type=number]{min-width:76px}td .wide{min-width:170px}.clientname{font-weight:650;min-width:120px}.alert-cell{background:var(--redbg)!important;color:var(--red)}.alert-mark{font-weight:800;color:var(--red);margin-left:4px}.status{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:650}.status.good{background:var(--greenbg);color:var(--green)}.status.bad{background:var(--redbg);color:var(--red)}.status.wait{background:#f0f2f6;color:#647084}.status.warn{background:var(--amberbg);color:var(--amber)}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{padding:10px 12px;border-radius:8px;background:#f3f6ff;color:#334b8d;font-size:12px;margin-bottom:12px}.notice.warning{background:var(--amberbg);color:#795600}.notice.error{background:var(--redbg);color:var(--red)}.notice.success{background:var(--greenbg);color:var(--green)}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;align-items:end}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%}.progress{height:8px;background:#edf0f5;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}.tasklist{display:grid;gap:8px}.task{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.task.done{background:#f8fbf9}.task .taskname{flex:1;min-width:0}.task.done .taskname{text-decoration:line-through;color:#778274}.timebadge{display:inline-block;background:#fff0d2;color:#8a5300;border:1px solid #f2d28e;border-radius:6px;padding:3px 7px;font-weight:750;margin-right:8px}.task-actions{display:flex;gap:4px}.pill{border-radius:7px;padding:4px 7px;background:#f2f4f8;color:#5b6575;font-size:11px}.resultcount{color:var(--muted);font-size:12px}.hidden{display:none!important}.dangertext{color:var(--red)}.excel-grid{max-height:55vh;overflow:auto}.excel-grid table{white-space:normal}.excel-grid td{min-width:100px}.excel-grid td input{min-width:100px}.column-menu{display:flex;gap:10px;flex-wrap:wrap;padding:10px;background:#f8f9fc;border-radius:8px;margin:10px 0}.column-menu label{font-size:12px;display:flex;gap:5px;align-items:center}.toast{position:fixed;right:24px;bottom:24px;z-index:100;background:#202938;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px #0002;max-width:min(420px,90vw)}.toast.error{background:#9f2222}.filelabel{display:inline-flex;align-items:center;gap:6px}.filelabel input{display:none}.footerhint{font-size:12px;color:var(--muted);margin-top:10px}.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fafbfc;font-size:11px}.searchrow{display:flex;gap:8px;flex-wrap:wrap}.searchrow input{min-width:220px;flex:1}.empty-state{padding:42px 18px;text-align:center;color:var(--muted)}.empty-state strong{display:block;color:#384456;margin-bottom:6px}@media(max-width:1000px){.sidebar{width:190px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.app{display:block}.sidebar{width:100%;padding:12px;gap:8px}.brand{padding-bottom:3px}.nav{grid-template-columns:repeat(3,minmax(0,1fr))}.nav button{font-size:12px;padding:8px}.sidefoot{display:none}.main{padding:16px 12px 30px}.topbar{display:block}.top-actions{margin-top:12px}.quickgrid,.stats{grid-template-columns:1fr 1fr}.panel{padding:12px}.formgrid{grid-template-columns:1fr 1fr}}
tfoot th{background:#eaf0ff;color:#1c356c;font-weight:800;border-top:2px solid #8ca8ef} .clientname{cursor:grab;user-select:none} .clientname:active{cursor:grabbing}
</style>

<body><div class="app">
<aside class="sidebar"><div class="brand">跟单文员工作台<small>个人 CRM · 本地数据版</small></div><nav class="nav" id="nav">
<button class="active" data-page="home">▦　工作台</button><button data-page="excel">▤　Excel 处理</button><button data-page="orders">☷　客户录单跟进</button><button data-page="labels">▧　标签跟进</button><button data-page="names">⌕　品名查询</button><button data-page="tasks">✓　今日流程核对</button><button data-page="mistakes">✎　易错点汇总</button>
</nav><div class="sidefoot">数据保存在当前浏览器<br>建议定期导出备份文件</div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow" id="eyebrow">PERSONAL CRM WORKSPACE</div><div class="page-title" id="pageTitle">工作台</div><div class="sub" id="pageSub">查看今天的跟单、标签与流程进度。</div></div><div class="top-actions"><label class="smalltext" for="globalDate">工作日期</label><input class="date-input" type="date" id="globalDate"><button id="backupBtn">导出备份</button><label class="filelabel"><button id="restoreTrigger">导入备份</button><input type="file" id="restoreFile" accept="application/json"></label></div><div id="cloudControls" style="padding:6px 10px;font-size:12px"><span id="cloudState">云同步：未登录</span> <input id="cloudEmail" type="email" placeholder="邮箱（用于电脑/手机登录）" style="width:195px;padding:6px"> <input id="cloudPassword" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" style="width:160px;padding:6px"> <button id="cloudLogin">密码登录</button> <button id="cloudSignup">注册账号</button> <button id="cloudLogout" style="display:none">退出云端账号</button></div></header><div id="pageContent" class="content"></div></main>
</div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const KEY='pork_crm_workbench_v1';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const initialTasks=[{id:'t1',name:'发送沙湾销售单，填充喜家德和沙湾',time:''},{id:'t2',name:'按顺序录单',time:''},{id:'t3',name:'打中味标签，录入',time:'18:30'},{id:'t4',name:'打亦成标签，录入',time:'19:30'},{id:'t5',name:'检查邮箱，确认改单标签',time:'22:00'},{id:'t6',name:'打印销售总表带下楼，截图发群',time:''},{id:'t7',name:'做商品明细表发群',time:''}];
const fresh=()=>({version:1,clients:[],labelClients:null,nextLabelClient:1,orderDaily:{},labelDaily:{},labelMeta:{},nameRecords:[],tasks:initialTasks.map(x=>({...x})),taskDaily:{},mistakes:[],nextMistake:1,nextClient:1,nextName:1});
let db=load(),page='home',workDate=today(),excel={name:'',sheetName:'',sheets:[],headers:[],rows:[],originalRows:[],hidden:[],widths:{},selected:new Set(),undo:[],issues:[],sort:{col:-1,dir:1},filter:'',mapping:{},dirty:false};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function load(){try{const s=localStorage.getItem(KEY);if(!s)return fresh();const x=JSON.parse(s);return {...fresh(),...x}}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));if(window.crmCloudSave)window.crmCloudSave();return true}catch(e){toast('本地存储失败：浏览器空间可能已满。请先导出备份。',true);return false}}
function toast(msg,err=false){const el=$('#toast');el.textContent=msg;el.className='toast'+(err?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3200)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v).replace(/\n/g,' ')}function fmt(v){return v===undefined||v===null?'':String(v)}
function ensureLabelClients(){
 if(Array.isArray(db.labelClients)){
   db.labelClients=db.labelClients.filter(c=>c&&typeof c.id==='string');
   db.nextLabelClient=Math.max(Number(db.nextLabelClient)||1,1,...db.labelClients.map(c=>Number(String(c.id).replace(/^l/,''))||0).map(n=>n+1));
   return;
 }
 // One-time migration of actual legacy label records only. Never clone the order customer list.
 const legacyIds=new Set(Object.keys(db.labelMeta||{}));
 for(const day of Object.values(db.labelDaily||{}))for(const id of Object.keys(day||{}))legacyIds.add(id);
 const mapping={},existing=db.clients||[];
 db.labelClients=[];
 for(const oldId of legacyIds){
   const source=existing.find(c=>c.id===oldId);
   const id='l'+(db.labelClients.length+1);
   mapping[oldId]=id;
   db.labelClients.push({id,name:source?.name||'标签客户 '+(db.labelClients.length+1),order:db.labelClients.length+1,archived:false});
 }
 for(const date of Object.keys(db.labelDaily||{})){
   const previous=db.labelDaily[date]||{},migrated={};
   for(const [id,value] of Object.entries(previous))migrated[mapping[id]||id]=value;
   db.labelDaily[date]=migrated;
 }
 const meta={};for(const [id,value] of Object.entries(db.labelMeta||{}))meta[mapping[id]||id]=value;
 db.labelMeta=meta;db.nextLabelClient=db.labelClients.length+1;
}
ensureLabelClients();
function labelClients(){ensureLabelClients();return db.labelClients.filter(c=>!c.archived).slice().sort((a,b)=>a.order-b.order)}
function addLabelClient(name){name=name.trim();if(!name)return toast('请输入客户名称',true);if(labelClients().some(c=>c.name===name))return toast('标签客户已存在',true);db.labelClients.push({id:'l'+db.nextLabelClient++,name,order:db.labelClients.reduce((m,c)=>Math.max(m,c.order||0),0)+1,archived:false});save();render();toast('标签客户已添加')}
function daily(bucket,date=workDate){if(!db[bucket][date])db[bucket][date]={};return db[bucket][date]}
function clientOrder(){return db.clients.slice().sort((a,b)=>a.order-b.order)}
function addClient(name){name=name.trim();if(!name)return toast('请先输入客户名称',true);if(db.clients.some(c=>c.name===name&&!c.archived))return toast('该客户名称已存在',true);db.clients.push({id:'c'+db.nextClient++,name,order:db.clients.reduce((m,c)=>Math.max(m,c.order),0)+1,archived:false});save();render();toast('客户已添加')}
function renameClient(id,name){name=name.trim();if(!name)return toast('客户名称不能为空',true);if(db.clients.some(c=>c.id!==id&&c.name===name&&!c.archived))return toast('该客户名称已存在',true);const c=db.clients.find(x=>x.id===id);if(c){c.name=name;save();render();toast('客户名称已保存')}}
function moveClient(id,delta){const a=clientOrder().filter(c=>!c.archived),i=a.findIndex(c=>c.id===id),j=i+delta;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];save();render()}
function deleteClient(id){const c=db.clients.find(x=>x.id===id);if(!c)return;if(!confirm(`确定停用客户“${c.name}”吗？\n客户将从看板隐藏，历史记录和长期备注保留。`))return;c.archived=true;save();render();toast('客户已停用，历史数据保留')}
function activeClients(){return clientOrder().filter(c=>!c.archived)}
function go(p){page=p;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
const titles={home:['工作台','查看今天的跟单、标签与流程进度。'],excel:['Excel 处理','导入、检查、清洗并导出实际表格数据。'],orders:['客户录单跟进','按日期记录客户订单状态；录单客户名单与标签工作台独立。'],labels:['标签跟进','按日期记录标签张数与金额，打印类型和备注长期保存。'],names:['品名查询','维护客户品名、别名与特殊备注原文。'],tasks:['今日流程核对','每天独立勾选固定工作流程，不自动执行业务操作。'],mistakes:['易错点汇总','记录易错点、错误次数和掌握程度，内容长期保存。']};
function render(){const [t,s]=titles[page];$('#pageTitle').textContent=t;$('#pageSub').textContent=s;$('#globalDate').value=workDate;$('#pageContent').innerHTML=({home:homePage,orders:ordersPage,labels:labelsPage,names:namesPage,tasks:tasksPage,mistakes:mistakesPage,excel:excelPage})[page]();bindCommon();}
function bindCommon(){ $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#globalDate').onchange=e=>{if(e.target.value){workDate=e.target.value;render()}};$('#backupBtn').onclick=backup;$('#restoreTrigger').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=restore; }
function homePage(){const od=daily('orderDaily'),ld=daily('labelDaily'),td=db.taskDaily[workDate]||{};const clients=activeClients();let orders=0,changes=0,orderAlerts=0,labelNeed=0,labelAlerts=0;clients.forEach(c=>{let o=od[c.id]||{};if(o.hasOrder==='yes'){orders++;if(o.change?.trim()&&o.changeStatus!=='done')changes++;if(!o.amount||!o.jin||!o.complete||!o.group)orderAlerts++}});labelNeed=0;labelAlerts=0;labelClients().forEach(c=>{const l=ld[c.id]||{};if(l.need==='yes'){labelNeed++;if(l.count===''||l.amount==='')labelAlerts++}});const done=db.tasks.filter(t=>td[t.id]).length;return `<div class="stats"><div class="stat" data-go="orders"><div class="label">今日有单客户</div><div class="num">${orders}</div><div class="desc">${clients.length} 位启用客户 · ${orderAlerts} 位有待补字段</div></div><div class="stat" data-go="orders"><div class="label">待处理订单变化</div><div class="num">${changes}</div><div class="desc">已记录变化但尚未确认完成</div></div><div class="stat" data-go="labels"><div class="label">需要打标签</div><div class="num">${labelNeed}</div><div class="desc">${labelAlerts} 位张数或金额未填写</div></div><div class="stat" data-go="tasks"><div class="label">今日流程进度</div><div class="num">${done}/${db.tasks.length}</div><div class="desc">已完成任务数量</div><div class="progress"><span style="width:${db.tasks.length?done/db.tasks.length*100:0}%"></span></div></div></div>
<div class="panel"><div class="panel-head"><div><h2>快捷入口</h2><div class="smalltext">选择模块直接开始处理</div></div><button class="danger" id="clearDay">清空当日工作区</button></div><div class="quickgrid"><div class="quick" data-go="orders"><strong>☷ 客户录单跟进</strong><span class="smalltext">录入金额、斤数、群消息和订单变化</span></div><div class="quick" data-go="labels"><strong>▧ 标签跟进</strong><span class="smalltext">核对标签需求、张数、金额与打印类型</span></div><div class="quick" data-go="names"><strong>⌕ 品名查询</strong><span class="smalltext">查询客户品名、别名及特殊备注</span></div><div class="quick" data-go="excel"><strong>▤ Excel 处理</strong><span class="smalltext">导入表格、检查数据并另存处理结果</span></div><div class="quick" data-go="tasks"><strong>✓ 今日流程核对</strong><span class="smalltext">当前日期完成 ${done}/${db.tasks.length} 项</span></div><div class="quick" data-go="excel"><strong>⇧ 数据备份</strong><span class="smalltext">导出本地资料 JSON 备份文件</span></div></div></div>
<div class="panel"><div class="panel-head"><h2>数据保存说明</h2><span class="status good">自动保存</span></div><div class="smalltext">客户名单、打印类型、标签备注、品名资料和固定任务长期保存；每日订单、标签和任务勾选按日期分别保存。清空当日工作区不会删除其他日期记录。建议定期点击右上角「导出备份」。</div></div>`}
function clientAdder(){return `<div class="row"><input id="newClient" placeholder="输入客户名称后添加" maxlength="100"><button class="primary" id="addClient">添加客户</button><span class="smalltext">客户名单为空时可从这里开始建立。</span></div>`}
function orderRow(c,idx,d){const x=d[c.id]||{},yes=x.hasOrder==='yes';const missing=k=>yes&&!String(x[k]??'').trim();const changed=yes&&(x.changeFlag==='yes'||(!x.changeFlag&&!!String(x.change||'').trim()));const comm=x.changeStatus==='done'?'done':x.changeStatus==='todo'?'todo':'';return `<tr data-id="${c.id}"><td><div class="clientname" draggable="true" title="拖动客户名称调整顺序">⠿ ${esc(c.name)}</div></td><td><select data-order="hasOrder" data-id="${c.id}"><option value="no" ${!yes?'selected':''}>无单</option><option value="yes" ${yes?'selected':''}>有单</option></select></td><td class="${missing('amount')?'alert-cell':''}"><input data-order="amount" data-id="${c.id}" type="number" min="0" step="0.01" value="${attr(x.amount??'')}" placeholder="${yes?'金额':''}" ${!yes?'disabled':''}></td><td class="${missing('jin')?'alert-cell':''}"><input data-order="jin" data-id="${c.id}" type="number" min="0" step="0.01" value="${attr(x.jin??'')}" placeholder="${yes?'斤数':''}" ${!yes?'disabled':''}></td><td class="${missing('complete')?'alert-cell':''}"><select data-order="complete" data-id="${c.id}" ${!yes?'disabled':''}><option value="" ${!x.complete?'selected':''}></option><option value="done" ${x.complete==='done'?'selected':''}>✅ 已完成</option><option value="todo" ${x.complete==='todo'?'selected':''}>❌ 未完成</option></select></td><td class="${missing('group')?'alert-cell':''}"><select data-order="group" data-id="${c.id}" ${!yes?'disabled':''}><option value="" ${!x.group?'selected':''}></option><option value="received" ${x.group==='received'?'selected':''}>✅ 已收到</option><option value="missing" ${x.group==='missing'?'selected':''}>❌ 未收到</option></select></td><td class="${yes&&changed?'alert-cell':''}"><select data-order="changeFlag" data-id="${c.id}" ${!yes?'disabled':''}><option value="no" ${!changed?'selected':''}>✅ 无变化</option><option value="yes" ${changed?'selected':''}>❗ 有变化</option></select>${changed?`<input class="wide" data-order="change" data-id="${c.id}" value="${attr(x.change||'')}" placeholder="变化说明（可选）">`:''}</td><td class="${changed&&comm!=='done'?'alert-cell':''}">${changed?`<select data-order="changeStatus" data-id="${c.id}"><option value="" ${!comm?'selected':''}>❗ 请选择</option><option value="todo" ${comm==='todo'?'selected':''}>❌ 未沟通</option><option value="done" ${comm==='done'?'selected':''}>✅ 已沟通</option></select>`:''}</td></tr>`}
function sumDaily(clients,d,key,gate){return clients.reduce((n,c)=>n+((d[c.id]||{})[gate]==='yes'?(Number((d[c.id]||{})[key])||0):0),0).toLocaleString('zh-CN',{maximumFractionDigits:2})}
function ordersPage(){const d=daily('orderDaily');const clients=activeClients();const sorted=clients;return `<div class="panel"><div class="panel-head"><div><h2>客户录单跟进看板</h2><div class="smalltext">拖动客户名称可调整行顺序；红色栏位表示需要处理。</div></div><div class="row"><button id="exportOrders">导出当日跟进表 CSV</button><button class="danger" id="clearOrders">清空当日记录</button></div></div>${clientAdder()}<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>客户名称（拖动排序）</th><th>是否有单</th><th>总金额</th><th>总斤数</th><th>完成情况</th><th>群消息是否收到</th><th>订单变化</th><th>是否更改且对接沟通</th></tr></thead><tbody>${sorted.length?sorted.map((c,i)=>orderRow(c,i,d)).join(''):'<tr><td colspan="8" class="empty">暂无客户。请先添加客户名称。</td></tr>'}</tbody><tfoot><tr class="total-row"><th>今日合计</th><th></th><th>${sumDaily(sorted,d,'amount','hasOrder')}</th><th>${sumDaily(sorted,d,'jin','hasOrder')}</th><th colspan="4">金额 / 斤数自动汇总</th></tr></tfoot></table></div><div class="footerhint">状态自动保存到 ${workDate}。选择「无单」会清空该客户当天订单相关字段；若存在数据会先询问确认。</div></div>`}
function labelsPage(){const d=daily('labelDaily');const clients=labelClients();return `<div class="panel"><div class="panel-head"><div><h2>标签跟进看板</h2><div class="smalltext">标签状态、张数和金额按日期保存；打印类型和备注长期保存。</div></div><div class="row"><button id="exportLabels">导出当日标签表 CSV</button><button class="danger" id="clearLabels">清空当日数据</button></div></div>${clientAdder()}<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>客户名称（拖动排序）</th><th>标签</th><th>张数</th><th>金额</th><th>打印类型（长期）</th><th>备注（长期）</th></tr></thead><tbody>${clients.length?clients.map(c=>{const x=d[c.id]||{},m=db.labelMeta[c.id]||{},need=x.need==='yes',badCount=need&&fmt(x.count)==='',badAmount=need&&fmt(x.amount)==='';return `<tr data-id="${c.id}"><td><div class="clientname">${esc(c.name)}</div><div class="smalltext" style="cursor:grab">⠿ 拖动此行排序</div></td><td><select data-label="need" data-id="${c.id}"><option value="no" ${!need?'selected':''}>不需要打标签</option><option value="yes" ${need?'selected':''}>需要打标签</option></select></td><td class="${badCount?'alert-cell':''}"><input data-label="count" data-id="${c.id}" type="number" min="0" step="1" placeholder="张数" value="${need?attr(x.count||''):''}" ${!need?'disabled':''}>${badCount?'<span class="alert-mark">❗</span>':''}</td><td class="${badAmount?'alert-cell':''}"><input data-label="amount" data-id="${c.id}" type="number" min="0" step="0.01" placeholder="金额" value="${need?attr(x.amount||''):''}" ${!need?'disabled':''}>${badAmount?'<span class="alert-mark">❗</span>':''}</td><td><input data-meta="printType" data-id="${c.id}" value="${attr(m.printType||'')}" placeholder="输入打印类型"></td><td><input class="wide" style="color:#c62828;font-weight:700" data-meta="note" data-id="${c.id}" value="${attr(m.note||'')}" placeholder="客户标签备注"></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">暂无客户。请在标签工作台单独添加客户。</td></tr>'}</tbody><tfoot><tr class="total-row"><th>今日合计</th><th></th><th>${sumDaily(clients,d,'count','need')}</th><th>${sumDaily(clients,d,'amount','need')}</th><th colspan="2">张数 / 金额自动汇总</th></tr></tfoot></table></div><div class="footerhint">默认按「不需要打标签」处理。选择「不需要」会清空当天张数和金额；若已有数据会先确认。</div></div>`}
function namesPage(){const q=window.nameQuery||'',mode=window.nameMode||'customer';const filtered=db.nameRecords.filter(r=>{const term=q.trim().toLowerCase();if(!term)return true;const hay=mode==='customer'?r.customer:r.product;return [hay,r.customer,r.product,r.alias,r.note].some(v=>String(v||'').toLowerCase().includes(term))});return `<div class="panel"><div class="panel-head"><div><h2>品名查询资料库</h2><div class="smalltext">保留原始名称和备注原文；查询结果显示全部匹配记录。</div></div><div class="row"><button id="exportNames">导出资料 CSV</button><label class="filelabel"><button id="importNamesTrigger">导入 CSV</button><input type="file" id="importNamesFile" accept=".csv,text/csv"></label></div></div><div class="searchrow"><select id="nameMode"><option value="customer" ${mode==='customer'?'selected':''}>按客户查询</option><option value="product" ${mode==='product'?'selected':''}>按标准产品查询</option><option value="all" ${mode==='all'?'selected':''}>全部字段查询</option></select><input id="nameSearch" value="${attr(q)}" placeholder="输入客户或产品关键词，支持部分匹配"><button class="primary" id="newName">新增资料</button></div><div class="row spread" style="margin:14px 0 8px"><span class="resultcount">匹配 ${filtered.length} 条 / 共 ${db.nameRecords.length} 条</span></div><div class="table-wrap"><table><thead><tr><th>客户名称</th><th>客户使用名</th><th>标准名称</th><th>备注</th><th>操作</th></tr></thead><tbody>${filtered.length?filtered.map(r=>`<tr><td>${esc(r.customer)}</td><td>${esc(r.alias)}</td><td>${esc(r.product)}</td><td style="white-space:normal;min-width:180px">${esc(r.note)}</td><td><div class="row"><button class="small" data-editname="${r.id}">编辑</button><button class="small danger" data-delname="${r.id}">删除</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">未找到相关记录。可以点击「新增资料」直接录入。</td></tr>'}</tbody></table></div></div><div class="panel"><h3>资料录入格式</h3><div class="smalltext" style="margin-top:6px">导入 CSV 推荐表头：客户名称、客户使用名、标准名称、备注；旧版 CSV 表头也兼容。导入时不自动改写原始文字。</div></div>`}
function mistakesPage(){const rows=Array.isArray(db.mistakes)?db.mistakes:[];return `<div class="panel"><div class="panel-head"><div><h2>易错点汇总</h2><div class="smalltext">笔记长期保存；拖动掌握程度滑块，0% 为尚未掌握，100% 为完全掌握。</div></div><button class="primary" id="addMistake">＋ 新增笔记</button></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th style="width:65px">序号</th><th>易错点</th><th style="width:140px">错误次数</th><th style="min-width:220px">掌握程度</th></tr></thead><tbody>${rows.map((m,i)=>`<tr><td>${i+1}</td><td><textarea data-mistake-field="text" data-id="${attr(m.id)}" rows="2" style="width:100%;min-width:220px" placeholder="记录容易出错的地方">${esc(m.text||'')}</textarea></td><td><input type="number" min="0" step="1" inputmode="numeric" data-mistake-field="count" data-id="${attr(m.id)}" value="${attr(m.count??0)}" style="width:105px"></td><td><div class="row" style="flex-wrap:nowrap"><input type="range" min="0" max="100" step="5" data-mistake-field="progress" data-id="${attr(m.id)}" value="${attr(m.progress??0)}" style="min-width:100px;flex:1"><strong data-mistake-progress="${attr(m.id)}">${Number(m.progress)||0}%</strong></div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无笔记，点击右上角「新增笔记」。</td></tr>'}</tbody></table></div></div>`}
function tasksPage(){const state=db.taskDaily[workDate]||{};const done=db.tasks.filter(t=>state[t.id]).length;return `<div class="panel"><div class="panel-head"><div><h2>今日流程清单</h2><div class="smalltext">任务模板长期保存，勾选状态按日期独立保存。</div></div><div class="row"><button id="addTask">新增任务</button><button class="danger" id="resetTasks">全部重置</button></div></div><div class="row spread" style="margin-bottom:8px"><strong>已完成 ${done}/${db.tasks.length} 项</strong><span class="smalltext">${db.tasks.length?Math.round(done/db.tasks.length*100):0}% 完成</span></div><div class="progress" style="margin-bottom:16px"><span style="width:${db.tasks.length?done/db.tasks.length*100:0}%"></span></div><div class="tasklist">${db.tasks.map((t,i)=>`<div class="task ${state[t.id]?'done':''}" data-taskrow="${t.id}" style="cursor:pointer"><input type="checkbox" data-taskcheck="${t.id}" ${state[t.id]?'checked':''} aria-label="完成任务"><div class="taskname">${t.time?`<span class="timebadge">${esc(t.time)}</span>`:''}<span>${esc(t.name)}</span></div><span class="status ${state[t.id]?'good':'wait'}">${state[t.id]?'✅ 已完成':'待完成'}</span><div class="task-actions"><button class="small" data-taskedit="${t.id}">编辑</button><button class="small" data-taskmove="-1" data-id="${t.id}" ${i===0?'disabled':''}>↑</button><button class="small" data-taskmove="1" data-id="${t.id}" ${i===db.tasks.length-1?'disabled':''}>↓</button><button class="small danger" data-taskdelete="${t.id}">删除</button></div></div>`).join('')||'<div class="empty">暂无任务，请新增任务。</div>'}</div><div class="footerhint">本模块只做人工核对，不会自动发送、录单、打印或执行其他业务动作。</div></div>`}
function excelPage(){const loaded=excel.headers.length>0;return `<div class="panel"><div class="panel-head"><div><h2>Excel 专项处理功能区</h2></div></div><div class="quickgrid"><div class="quick"><strong>1️⃣ 销售总表处理</strong><span class="smalltext">等待你提供保留列、字段和清洗模板规则</span></div><div class="quick"><strong>2️⃣ 文件核对处理</strong><span class="smalltext">等待你提供两份表格的匹配字段及差异判定规则</span></div><div class="quick"><strong>3️⃣ 重点标黄</strong><span class="smalltext">等待你设定敏感词、匹配范围及标黄规则</span></div><div class="quick"><strong>4️⃣ 待定</strong><span class="smalltext">暂不配置</span></div></div><div class="notice warning" style="margin-top:12px">专项模板尚未配置，暂不自动处理文件，以免误改数据。下方保留原有通用 Excel 工具。</div></div><div class="panel"><div class="panel-head"><div><h2>通用 Excel 数据处理</h2><div class="smalltext">原始文件不会被修改；处理后的结果需另行导出。</div></div><span class="status ${window.XLSX?'good':'warn'}">${window.XLSX?'Excel 引擎可用':'当前仅 CSV 可用'}</span></div><div class="notice ${window.XLSX?'':'warning'}">${window.XLSX?'已检测到 SheetJS，可读取和导出 XLSX/XLS/CSV。':'未加载 SheetJS：CSV 功能可用；XLSX/XLS 需要联网加载库，或按交付说明放置本地 xlsx.full.min.js。'}</div><div class="row"><label class="filelabel"><button class="primary" id="excelFileTrigger">选择 Excel / CSV 文件</button><input id="excelFile" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><span class="smalltext">${loaded?`当前文件：${esc(excel.name)} · ${excel.rows.length} 行 · ${excel.headers.length} 列`:'尚未导入文件'}</span></div>${loaded?`<div class="row" style="margin-top:12px"><label class="smalltext">工作表 <select id="excelSheet">${excel.sheets.map(s=>`<option ${s===excel.sheetName?'selected':''}>${esc(s)}</option>`).join('')}</select></label><input id="excelSearch" value="${attr(excel.filter)}" placeholder="搜索表格内容"><button id="checkExcel">数据检查</button><button id="undoExcel" ${excel.undo.length?'':'disabled'}>撤销上一步</button><button id="addExcelRow">新增行</button><button id="deleteExcelRows" class="danger">删除选中行</button><button id="exportExcelCsv">导出 CSV</button><button id="exportExcelXlsx">导出 Excel</button></div><div class="column-menu"><strong class="smalltext">显示列：</strong>${excel.headers.map((h,i)=>`<label><input type="checkbox" data-colvisible="${i}" ${excel.hidden.includes(i)?'':'checked'}>${esc(h||`列${i+1}`)}</label>`).join('')}</div><div id="excelIssues">${excel.issues.length?`<div class="notice warning">上次数据检查发现 ${excel.issues.length} 项提示</div>`:''}</div><div class="excel-grid table-wrap"><table><thead><tr><th><input type="checkbox" id="selectAllExcel"></th>${excel.headers.map((h,i)=>excel.hidden.includes(i)?'':`<th><button class="small" data-sortcol="${i}" title="点击排序">${esc(h||`列${i+1}`)} ↕</button><div><input data-renamecol="${i}" value="${attr(h)}" title="修改列名" style="width:100%;min-width:70px;padding:4px;font-size:11px"></div></th>`).join('')}</tr></thead><tbody>${excelDisplayRows().map((row,ri)=>`<tr><td><input type="checkbox" data-excelrow="${row._index}" ${excel.selected.has(row._index)?'checked':''}></td>${row.values.map((v,ci)=>excel.hidden.includes(ci)?'':`<td><input data-excelcell="${row._index}" data-col="${ci}" value="${attr(v)}" style="width:${Math.max(100,Number(excel.widths[ci]||140))}px"></td>`).join('')}</tr>`).join('')||`<tr><td colspan="${excel.headers.length+1}" class="empty">没有匹配行</td></tr>`}</tbody></table></div><div class="footerhint">提示：点击列名排序；列名输入框可改名；可隐藏列、编辑单元格、选中并删除行。当前编辑结果仅在此页面会话中保留，导出文件后保存到电脑；CRM 长期资料不会受影响。</div>`:`<div class="empty-state"><strong>导入一个表格开始处理</strong>支持 CSV 离线使用；XLS/XLSX 需 SheetJS 库加载成功。导入的数据只在当前页面会话中处理，不会自动写入 CRM 长期资料。</div>`}</div><div class="panel"><div class="panel-head"><h3>字段映射 / 清洗工具</h3><span class="smalltext">请明确选择目标列，不会自动猜测列含义</span></div>${loaded?`<div class="formgrid"><div class="field"><label>目标列</label><select id="cleanCol">${excel.headers.map((h,i)=>`<option value="${i}">${esc(h||`列${i+1}`)}</option>`).join('')}</select></div><div class="field"><label>处理方式</label><select id="cleanAction"><option value="trim">去除首尾空格</option><option value="empty">将空白统一为指定值</option><option value="upper">转为大写</option><option value="lower">转为小写</option><option value="number">转为数字（无法转换的保留原值）</option><option value="replace">查找并替换</option><option value="unit">单位转换：斤 → 千克</option></select></div><div class="field" id="cleanArgWrap"><label>参数（按需填写）</label><input id="cleanArg" placeholder="空白值 / 查找值"></div><div class="field"><label>替换为（查找替换时）</label><input id="cleanArg2" placeholder="替换文本"></div></div><div class="row" style="margin-top:12px"><button class="primary" id="applyClean">应用到目标列</button><button id="copyExcelRows">复制选中行到剪贴板</button></div>`:'<div class="smalltext">导入表格后，可选择目标列并执行标准化或单位转换。无法判断的数据类型需由你自行确认。</div>'}</div>`}
function excelDisplayRows(){let arr=excel.rows.map((values,i)=>({values,_index:i}));if(excel.filter){const q=excel.filter.toLowerCase();arr=arr.filter(r=>r.values.some(v=>String(v??'').toLowerCase().includes(q)))}if(excel.sort.col>=0){const {col,dir}=excel.sort;arr.sort((a,b)=>String(a.values[col]??'').localeCompare(String(b.values[col]??''),'zh-CN',{numeric:true,sensitivity:'base'})*dir)}return arr}
function bindPage(){
$$('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));
if(page==='orders'||page==='labels'){let dragged=null;document.querySelectorAll('tbody tr[data-id]').forEach(tr=>{const grip=tr.querySelector('.clientname');if(!grip)return;grip.style.cursor="grab";grip.draggable=true;tr.draggable=true;grip.title='按住拖动调整客户顺序';tr.ondragstart=e=>{if(e.target.closest('input,select,button,textarea')){e.preventDefault();return}dragged=tr.dataset.id;e.dataTransfer.setData('text/plain',dragged);e.dataTransfer.effectAllowed='move';tr.style.opacity='0.55'};tr.ondragend=()=>{dragged=null;document.querySelectorAll('tbody tr[data-id]').forEach(row=>{row.style.opacity='';row.style.outline=''})};tr.ondragenter=e=>{if(dragged&&dragged!==tr.dataset.id)tr.style.outline='2px dashed #4285f4'};tr.ondragleave=e=>{if(!tr.contains(e.relatedTarget))tr.style.outline=''};tr.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};tr.ondrop=e=>{e.preventDefault();tr.style.outline='';const target=tr.dataset.id;if(!dragged||target===dragged)return;const ordered=page==='labels'?labelClients():activeClients();const from=ordered.findIndex(c=>c.id===dragged),to=ordered.findIndex(c=>c.id===target);if(from<0||to<0)return;const [item]=ordered.splice(from,1);ordered.splice(to,0,item);ordered.forEach((c,i)=>c.order=i+1);save();render()}})}

function csvEscape(v){const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function downloadCSV(name,rows){const content='\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');downloadBlob(name,new Blob([content],{type:'text/csv;charset=utf-8'}))}function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function cleanFile(n){return (n||'数据').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_')}

async function readExcel(file){if(!file)return;try{excel.name=file.name;excel.filter='';excel.selected.clear();excel.hidden=[];excel.widths={};excel.undo=[];if(/\.csv$/i.test(file.name)){const text=await file.text();const rows=parseCSV(text);excel.sheets=['CSV'];excel.sheetName='CSV';excel.headers=(rows.shift()||[]).map(String);excel.rows=rows.map(r=>excel.headers.map((_,i)=>r[i]??''));excel.originalRows=excel.rows.map(r=>r.slice())}else{if(!window.XLSX)throw Error('XLS/XLSX 需要加载 SheetJS。请联网重试，或将 xlsx.full.min.js 放在 HTML 同目录并修改 script 引用。');const data=await file.arrayBuffer();excel.workbook=XLSX.read(data,{type:'array',cellDates:true});excel.sheets=excel.workbook.SheetNames;loadSheet(excel.sheets[0]);}excel.dirty=false;render();toast(`已读取 ${file.name}`)}catch(e){toast('读取失败：'+e.message,true)}}

function backup(){const payload={app:'pork-crm-workbench',exportedAt:new Date().toISOString(),data:db};downloadBlob(`跟单文员CRM备份_${today()}.json`,new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));toast('备份文件已生成，请保存到安全位置')}
function restore(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const incoming=obj.data||obj;if(!incoming.clients||!incoming.orderDaily||!incoming.tasks)throw Error('文件结构不符合本应用备份格式');if(!confirm('导入备份会覆盖当前浏览器中的全部 CRM 数据。建议先导出当前备份。确定继续吗？'))return;db={...fresh(),...incoming};if(!save())return;workDate=today();render();toast('备份已导入')}catch(err){toast('导入失败：'+err.message,true)}finally{e.target.value=''}};reader.readAsText(f)}
function bindHome(){const b=$('#clearDay');if(b)b.onclick=()=>{if(confirm(`确定清空 ${workDate} 的工作区？将清除当天录单、标签和流程勾选状态；不会删除客户名单、标签备注、打印类型、品名资料、固定任务和其他日期历史。`)){delete db.orderDaily[workDate];delete db.labelDaily[workDate];delete db.taskDaily[workDate];save();render();toast('当日工作区已清空')}}}
// Keep rerenders scoped and wire module-specific controls after drawing.
const baseRender=render;render=function(){baseRender();bindPage();};
window.crmBridge={get:()=>JSON.parse(JSON.stringify(db)),set:(value)=>{db={...fresh(),...value};ensureLabelClients();localStorage.setItem(KEY,JSON.stringify(db));render()},backup:()=>{const raw=localStorage.getItem(KEY);if(raw)localStorage.setItem(KEY+'_before_cloud_'+Date.now(),raw)},resetDaily:(date)=>{db.orderDaily={};db.labelDaily={};db.taskDaily={};workDate=date;save();render()}};

// Independent customer manager. Event delegation does not alter order table event bindings.
(function(){
  const panel=document.createElement('div');
  panel.id='standaloneCustomerManager';
  panel.style.cssText='display:none;margin:12px 0;padding:14px;border:1px solid #d5dce9;border-radius:10px;background:white';
  function refresh(){
    const items=page==='labels'?labelClients():activeClients();
    panel.innerHTML='<strong>客户管理（改名 / 删除）</strong><div class="smalltext">删除客户需要确认，不影响其他客户。</div>'+
      (items.map(c=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee"><span>'+esc(c.name)+'</span><span><button type="button" data-client-action="rename" data-client-id="'+attr(c.id)+'">改名</button> <button type="button" class="danger" data-client-action="remove" data-client-id="'+attr(c.id)+'">删除</button></span></div>').join('')||'<p>暂无客户</p>');
  }
  document.addEventListener('click',function(e){
    const toggle=e.target.closest('#standaloneCustomerToggle');
    if(toggle){panel.style.display=panel.style.display==='none'?'block':'none';if(panel.style.display==='block')refresh();return}
    const btn=e.target.closest('[data-client-action]');
    if(!btn||!panel.contains(btn))return;
    const id=btn.dataset.clientId,kind=id.startsWith('l')?'labels':id.startsWith('c')?'orders':null;if(!kind||((page==='labels')!==(kind==='labels')))return;const list=kind==='labels'?db.labelClients:db.clients,c=list.find(x=>x.id===id);
    if(!c)return;
    if(btn.dataset.clientAction==='rename'){
      const name=prompt('修改客户名称',c.name);
      if(name===null)return;
      if(kind==='orders')renameClient(id,name);else{const trimmed=name.trim();if(!trimmed)return toast('客户名称不能为空',true);if(db.labelClients.some(x=>x.id!==id&&!x.archived&&x.name===trimmed))return toast('标签客户名称已存在',true);c.name=trimmed;save();render();toast('标签客户名称已保存')}
    }else{
      if(!confirm('确认删除「'+c.name+'」？只删除当前工作台的客户，不影响另一工作台。'))return;
      if(kind==='labels'){db.labelClients=db.labelClients.filter(x=>x.id!==id);for(const date of Object.keys(db.labelDaily||{}))if(db.labelDaily[date])delete db.labelDaily[date][id];if(db.labelMeta)delete db.labelMeta[id]}else{db.clients=db.clients.filter(x=>x.id!==id);for(const date of Object.keys(db.orderDaily||{}))if(db.orderDaily[date])delete db.orderDaily[date][id]}
      save();render();toast('客户已删除');
    }
    refresh();
  });
  const observer=new MutationObserver(function(){
    const add=document.getElementById('addClient');
    if(!add)return;
    const host=add.parentElement;
    if(!host.querySelector('#standaloneCustomerToggle')){
      const toggle=document.createElement('button');toggle.id='standaloneCustomerToggle';toggle.type='button';toggle.textContent='管理客户（改名 / 删除）';add.insertAdjacentElement('afterend',toggle);
    }
    if(!host.contains(panel))host.insertAdjacentElement('afterend',panel);
  });
  observer.observe(document.getElementById('pageContent'),{childList:true});
})();

$('#globalDate').value=workDate;render();
})();
</script>
